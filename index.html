<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#080b10">

  <title>Homem e a Máquina</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="machine-screen">

    <!-- =====================================================
         TOPO
         ===================================================== -->

    <header class="top-bar">

      <!-- Logo própria da Máquina -->
      <button
        class="machine-logo"
        id="machine-logo"
        type="button"
        aria-label="Abrir apresentação da Máquina"
      >
        <span class="logo-symbol">◈</span>
      </button>

      <!-- Configurações -->
      <button
        class="top-button"
        id="settings-button"
        type="button"
        aria-label="Abrir configurações"
      >
        <span>⚙</span>
      </button>

    </header>


    <!-- =====================================================
         CENTRO DA MÁQUINA
         ===================================================== -->

    <section
      class="machine-stage"
      aria-label="Máquina"
    >

      <!-- Atmosfera de luz ao redor.
           Não faz parte da Máquina. -->
      <div
        class="machine-ambient"
        aria-hidden="true"
      ></div>


      <!-- Máquina -->
      <div class="machine-presence">

        <div class="machine-body">

          <!-- Estrutura abstrata -->
          <span class="fragment fragment-1"></span>
          <span class="fragment fragment-2"></span>
          <span class="fragment fragment-3"></span>
          <span class="fragment fragment-4"></span>
          <span class="fragment fragment-5"></span>
          <span class="fragment fragment-6"></span>


          <!-- Profundidade interna -->
          <div class="machine-depth">

            <!-- Centro -->
            <div class="core-presence">

              <!-- Pequeno traço de luz -->
              <div
                class="voice-light"
                id="voice-light"
              >

                <!-- Ponto de observação -->
                <span class="observation-point"></span>

              </div>

            </div>

          </div>

        </div>

      </div>

    </section>


    <!-- =====================================================
         CONTROLOS
         ===================================================== -->

    <nav
      class="machine-controls"
      aria-label="Controles da Máquina"
    >

      <!-- Microfone -->
      <button
        class="control-button microphone-button"
        id="microphone-button"
        type="button"
        aria-label="Falar com a Máquina"
      >
        <span class="control-icon">⌁</span>
      </button>


      <!-- Teclado -->
      <button
        class="control-button keyboard-button"
        id="keyboard-button"
        type="button"
        aria-label="Conversar por mensagem"
      >
        <span class="keyboard-icon">
          <i></i>
          <i></i>
          <i></i>

          <i></i>
          <i></i>
          <i></i>

          <i></i>
          <i></i>
          <i></i>
        </span>
      </button>

    </nav>

  </main>


  <script src="app.js"></script>

</body>
  </html>
